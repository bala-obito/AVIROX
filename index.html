<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AVIROX</title>
<style>
:root{--c1:#22d3ee;--c2:#8b5cf6;--c3:#f472b6;--glass:rgba(16,18,52,.58);--line:rgba(255,255,255,.2)}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;touch-action:none;overscroll-behavior:none;color:#fff;
 font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
#game{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;overflow-y:auto;
 padding:calc(env(safe-area-inset-top,0px) + 70px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);
 opacity:0;pointer-events:none;transform:translateY(14px) scale(.97);transition:opacity .3s,transform .3s}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.dim{background:rgba(6,8,30,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
h1{margin:0;font-size:clamp(52px,14vmin,128px);font-weight:900;letter-spacing:.12em;padding-left:.12em;line-height:1;
 background:linear-gradient(90deg,#fff,var(--c1) 45%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 0 rgba(60,20,120,.6)) drop-shadow(0 0 26px rgba(34,211,238,.45))}
h2{margin:0;font-size:clamp(28px,6.5vmin,48px);font-weight:900;letter-spacing:.06em;text-shadow:0 4px 0 rgba(40,20,100,.6),0 0 24px rgba(139,92,246,.7)}
.sub{opacity:.85;letter-spacing:.22em;font-size:clamp(12px,2.3vmin,16px);font-weight:600;text-align:center}
button{font:inherit;font-weight:800;font-size:clamp(16px,3vmin,22px);letter-spacing:.08em;color:#fff;border:0;cursor:pointer;min-height:54px;min-width:210px;
 padding:12px 30px;border-radius:999px;background:linear-gradient(135deg,var(--c1),var(--c2));
 box-shadow:0 8px 0 #3b2a9c,0 14px 28px rgba(34,211,238,.3),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .1s,box-shadow .1s,filter .2s;margin-bottom:8px}
button:hover{filter:brightness(1.12);transform:translateY(-2px)}
button:active{transform:translateY(6px);box-shadow:0 2px 0 #3b2a9c,0 4px 10px rgba(34,211,238,.3),inset 0 2px 0 rgba(255,255,255,.45)}
button:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 8px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
button.ghost:active{box-shadow:0 2px 0 rgba(0,0,0,.4)}
button.sm{min-width:0;min-height:42px;font-size:clamp(12px,2.2vmin,14px);padding:8px 22px;opacity:.9;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px 30px;text-align:center;backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.panel small{opacity:.7;display:block;font-size:13px;letter-spacing:.15em}.panel b{display:block;font-size:clamp(34px,8vmin,56px)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.medal{padding:8px 22px;border-radius:999px;font-weight:800;letter-spacing:.1em;border:2px solid var(--m,#94a3b8);color:var(--m,#94a3b8);background:rgba(0,0,0,.3);box-shadow:0 0 20px var(--m,transparent)}
#preview{width:180px;height:140px;filter:drop-shadow(0 0 26px rgba(34,211,238,.45))}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;width:min(760px,100%);padding:10px}
#chars{touch-action:pan-y}
.card{position:relative;padding:10px 6px;border-radius:20px;text-align:center;cursor:pointer;font-weight:800;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);transition:transform .15s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px)}.card canvas{width:84px;height:66px;display:block;margin:0 auto 4px}
.card small{display:block;opacity:.65;font-weight:600;font-size:12px}
.card.sel{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1),0 0 28px rgba(34,211,238,.5)}
.card.sel::after{content:"SELECTED";position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:2px 10px;border-radius:999px;font-size:11px;letter-spacing:.1em;background:linear-gradient(135deg,var(--c1),var(--c2))}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}#hud.on{opacity:1}
#score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;font-size:clamp(54px,12vmin,96px);font-weight:900;line-height:1;
 text-shadow:0 5px 0 rgba(40,20,100,.65),0 0 30px rgba(34,211,238,.65)}
#score.pop{animation:pop .25s}@keyframes pop{50%{transform:scale(1.3)}}
#count{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:clamp(80px,22vmin,180px);font-weight:900;text-shadow:0 0 40px var(--c1)}
#ready{position:absolute;left:0;right:0;top:64%;text-align:center;font-weight:700;letter-spacing:.2em;font-size:clamp(14px,3vmin,22px);animation:bob 1s infinite alternate;text-shadow:0 2px 10px #000}
@keyframes bob{to{transform:translateY(-8px);opacity:.7}}
.ico{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;min-width:50px;width:50px;height:50px;min-height:50px;padding:0;margin:0;font-size:20px;pointer-events:auto}
#muteBtn{left:calc(env(safe-area-inset-left,0px) + 12px)}#pauseBtn{right:calc(env(safe-area-inset-right,0px) + 12px)}
@media (max-height:520px){#preview{width:116px;height:90px}h1{font-size:clamp(40px,11vmin,80px)}.screen{padding-top:64px;gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section class="screen" id="home">
  <h1>AVIROX</h1>
  <div class="sub">TAP · GLIDE · SURVIVE</div>
  <canvas id="preview" width="180" height="140"></canvas>
  <div class="sub" id="homeName"></div>
  <div class="sub" id="homeBest"></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <button data-act="play">PLAY</button>
    <button class="ghost" data-act="chars">CHARACTERS</button>
    <button class="ghost sm" id="resetBtn" data-act="reset">RESET PROGRESS</button>
  </div>
</section>

<section class="screen" id="chars">
  <h2>CHOOSE YOUR BIRD</h2>
  <div id="grid"></div>
  <button data-act="back">BACK</button>
</section>

<div id="hud">
  <div id="score">0</div>
  <div id="count"></div>
  <div id="ready">TAP · CLICK · SPACE</div>
</div>
<button class="ico ghost" id="pauseBtn" data-act="pause" aria-label="Pause">❚❚</button>
<button class="ico ghost" id="muteBtn" data-act="mute" aria-label="Toggle sound">🔊</button>

<section class="screen dim" id="pause">
  <h2>PAUSED</h2>
  <div class="sub" id="pauseInfo"></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <button data-act="resume">RESUME</button>
    <button class="ghost" data-act="restart">RESTART</button>
    <button class="ghost" data-act="home">HOME</button>
  </div>
</section>

<section class="screen dim" id="over">
  <h2>GAME OVER</h2>
  <div class="sub" id="overDiff"></div>
  <div class="row">
    <div class="panel"><small>SCORE</small><b id="fin">0</b></div>
    <div class="panel"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="medal" id="medal"></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <button data-act="restart">PLAY AGAIN</button>
    <button class="ghost" data-act="home">HOME</button>
  </div>
</section>

<script>
(() => {
'use strict';

/* ================= CONFIG ================= */
const DIFF = { // single balanced mode; speed up and gaps shrink automatically as the score grows
  normal: {n:'Normal', g:1580, f:-440, s0:165, s1:290, gap0:.265, gap1:.19, dist:240, amp:0}
};
const BIRDS = [
  {name:'Sunny',color:'Yellow',body:'#f8d030',wing:'#f0a820'},{name:'Blaze',color:'Red',body:'#e63b2e',wing:'#a82218'},
  {name:'Ocean',color:'Blue',body:'#2f8fe8',wing:'#1c5fb0'},{name:'Minty',color:'Green',body:'#42d17a',wing:'#23a055'},
  {name:'Shadow',color:'Black',body:'#3a3a44',wing:'#1c1c24'},{name:'Violet',color:'Purple',body:'#9a52e0',wing:'#6c2fb0'},
  {name:'Rosie',color:'Pink',body:'#ff8fc0',wing:'#e0558f'},{name:'Tangerine',color:'Orange',body:'#ff9a26',wing:'#d06a0a'},
  {name:'Frost',color:'Cyan',body:'#a8f0f8',wing:'#5cc8d8'},{name:'Golden',color:'Gold',body:'#ffc800',wing:'#c8900a'}
];
const PIPE = {easy:['#0b5a2a','#34d058','#d6ffe0'],normal:['#0a5560','#22d3ee','#d8fbff'],hard:['#7a2d0a','#fb923c','#ffe9d0'],insane:['#6b0f55','#e879f9','#fde4ff']};
const PAL = [ // sky top, sky bottom, far ridge, near ridge — cycles every 10 points
  {t:'#2a1a6e',b:'#ff8fb1',f:'#5a3b9a',n:'#2d1f66'},{t:'#1e88e5',b:'#9ae8ff',f:'#4f9fd6',n:'#2a6aa8'},
  {t:'#4a1c6b',b:'#ffb36b',f:'#a04a8a',n:'#4a1f5c'},{t:'#050818',b:'#1b2a66',f:'#243a8a',n:'#101c4a'}];
const MEDALS = [[50,'PLATINUM','#a5f3fc'],[30,'GOLD','#fbbf24'],[15,'SILVER','#cbd5e1'],[5,'BRONZE','#d08a50']];
const K = {sel:'avirox.bird', diff:'avirox.diff', mute:'avirox.mute', best:d=>'avirox.best.'+d};

/* ================= UTILITIES ================= */
const $ = id => document.getElementById(id);
const rgb = h => { const n=parseInt(h.slice(1),16); return [n>>16,n>>8&255,n&255]; };
const css = a => `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mix = (h,t,k) => { const a=rgb(h), b=t==='w'?[255,255,255]:[0,0,0]; return css(a.map((v,i)=>v+(b[i]-v)*k)); };
const Store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} },
  int(k,max){ const n=parseInt(this.get(k),10); return Number.isFinite(n)&&n>=0&&n<=max?n:0; }
};

/* ================= AUDIO ================= */
const Sound = {
  ctx:null, muted:Store.get(K.mute)==='1',
  unlock(){ try{ if(!this.ctx){ const A=window.AudioContext||window.webkitAudioContext; if(A) this.ctx=new A(); }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); }catch(e){ this.ctx=null; } },
  tone(f1,f2,d,type='sine',v=.09){
    if(this.muted||!this.ctx) return;
    try{ const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
      o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+d); }catch(e){}
  },
  flap(){ this.tone(420,700,.11,'triangle') }, point(p){ this.tone(p?1100:880,p?1760:1320,p?.24:.14,'sine',.12) },
  hit(){ this.tone(240,40,.35,'sawtooth',.13) }, tick(){ this.tone(600,600,.08,'square',.05) },
  toggle(){ this.muted=!this.muted; Store.set(K.mute,this.muted?1:0); }
};

const vib=p=>{ try{ if(!Sound.muted&&navigator.vibrate) navigator.vibrate(p); }catch(e){} };

/* ================= BIRD RENDERER (shared by game, home preview, cards) ================= */
function drawBird(c,x,y,w,d,ph,rot){
  const u=w/34, fl=Math.sin(ph), ol=mix(d.body,'k',.68); let g;
  c.save(); c.translate(x,y+1); c.rotate(rot||0); c.scale(u,u); c.lineJoin='round'; c.lineCap='round';
  const body=()=>{ c.beginPath(); c.moveTo(14.5,-2); c.bezierCurveTo(14.5,-10.5,7,-12.5,0,-11.6); c.bezierCurveTo(-8,-10.6,-14,-5.5,-19,-1);
    c.bezierCurveTo(-14,3.5,-8,11,0,11.6); c.bezierCurveTo(8,12,14.5,8,14.5,-2); c.closePath(); };
  // slim tail feathers
  c.save(); c.translate(-16,-.5);
  for(let i=-1;i<=1;i++){ c.save(); c.rotate(i*.34+.08); g=c.createLinearGradient(-11,0,0,0); g.addColorStop(0,mix(d.wing,'k',.4)); g.addColorStop(1,d.wing);
    c.fillStyle=g; c.strokeStyle=ol; c.lineWidth=1.1; c.beginPath(); c.ellipse(-4.5,0,6.5,2.2,0,0,7); c.fill(); c.stroke(); c.restore(); }
  c.restore();
  // small head crest
  for(let i=0;i<3;i++){ c.save(); c.translate(-2+i*3,-9.6); c.rotate(-.5+i*.38+fl*.05); g=c.createLinearGradient(0,-7,0,0); g.addColorStop(0,mix(d.wing,'w',.35)); g.addColorStop(1,d.wing);
    c.fillStyle=g; c.strokeStyle=ol; c.lineWidth=1; c.beginPath(); c.ellipse(0,-2.6,1.5,3.6,0,0,7); c.fill(); c.stroke(); c.restore(); }
  // sleek body
  g=c.createRadialGradient(-4,-7,1,0,0,22); g.addColorStop(0,mix(d.body,'w',.5)); g.addColorStop(.4,d.body); g.addColorStop(1,mix(d.body,'k',.42));
  body(); c.fillStyle=g; c.fill();
  c.save(); body(); c.clip(); g=c.createLinearGradient(0,2,0,12); g.addColorStop(0,mix(d.body,'w',.5)); g.addColorStop(1,mix(d.body,'w',.3));
  c.fillStyle=g; c.beginPath(); c.ellipse(3,11.5,13,5,-.05,0,7); c.fill(); c.restore();
  body(); c.strokeStyle=ol; c.lineWidth=1.5; c.stroke();
  c.fillStyle='rgba(255,80,120,.36)'; c.beginPath(); c.ellipse(9.2,2.6,3.2,2,0,0,7); c.fill();
  c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-3,-7.4,6,1.9,-.22,0,7); c.fill();
  // folded wing
  c.save(); c.translate(0,1.5); c.rotate(-.15+fl*.55); c.scale(.72,.66);
  g=c.createLinearGradient(0,-8,0,10); g.addColorStop(0,mix(d.wing,'w',.5)); g.addColorStop(.5,d.wing); g.addColorStop(1,mix(d.wing,'k',.4));
  c.fillStyle=g; c.strokeStyle=ol; c.lineWidth=1.5; c.beginPath();
  c.moveTo(2,-3); c.bezierCurveTo(-3,-9,-14,-6,-17,0); c.quadraticCurveTo(-18,4,-14,5.5); c.quadraticCurveTo(-13,9,-8,8); c.quadraticCurveTo(-5,11,0,8); c.quadraticCurveTo(4,5,2,-3);
  c.closePath(); c.fill(); c.stroke();
  c.strokeStyle='rgba(255,255,255,.38)'; c.lineWidth=1.1; c.beginPath(); c.moveTo(-1,-3); c.quadraticCurveTo(-9,-4,-14,0); c.stroke(); c.restore();
  // refined beak
  g=c.createLinearGradient(0,-1,0,4); g.addColorStop(0,'#ffd070'); g.addColorStop(1,'#ff8a2a');
  c.fillStyle=g; c.strokeStyle='rgba(120,40,0,.55)'; c.lineWidth=1; c.beginPath(); c.moveTo(11.5,-.8); c.quadraticCurveTo(24,0,23,3.6); c.quadraticCurveTo(17,4,11.5,3.6); c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#e8631a'; c.beginPath(); c.moveTo(11.5,3.8); c.quadraticCurveTo(18,4.1,22,4.6); c.quadraticCurveTo(19.5,8.4,11.5,7.6); c.closePath(); c.fill(); c.stroke();
  c.fillStyle='rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(16.5,.8,4,.7,.06,0,7); c.fill();
  // eye
  c.fillStyle='#fff'; c.beginPath(); c.arc(7,-4.2,4.9,0,7); c.fill(); c.strokeStyle=ol; c.lineWidth=1.2; c.stroke();
  g=c.createRadialGradient(8.4,-4.1,.4,8.4,-4.1,3.1); g.addColorStop(0,'#5aa9ff'); g.addColorStop(.55,'#2b5bb5'); g.addColorStop(1,'#14224d');
  c.fillStyle=g; c.beginPath(); c.arc(8.4,-4.1,3.0,0,7); c.fill();
  c.fillStyle='#000'; c.beginPath(); c.arc(8.9,-4.1,1.6,0,7); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(9.9,-5.3,1,0,7); c.fill(); c.beginPath(); c.arc(7.6,-2.9,.5,0,7); c.fill();
  c.strokeStyle=ol; c.lineWidth=1.5; c.beginPath(); c.moveTo(3.4,-10.2); c.quadraticCurveTo(7,-11.8,10.8,-9.6); c.stroke();
  // rim light along the back
  c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=1.3; c.beginPath(); c.moveTo(-11,-7.6); c.bezierCurveTo(-6,-10.6,2,-10.9,8,-9.4); c.stroke();
  c.restore();
}

/* ================= GAME STATE ================= */
const cv=$('game'), ctx=cv.getContext('2d'), hud=$('hud');
const screens={home:$('home'),chars:$('chars'),pause:$('pause'),over:$('over')};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S=1,W=0,H=0,dpr=1,GH=0,PW=64,state='home',sel=Store.int(K.sel,BIRDS.length-1);
const diff='normal';
let bird,pipes=[],parts=[],pops=[],pat=null,clouds=[],stars=[],score=0,speed=0,groundOff=0,bgT=0,shake=0,flash=0,cd=0,idleT=0,last=0;
const pal={}; for(const k in PAL[0]) pal[k]=rgb(PAL[0][k]);
const bestOf=d=>Store.int(K.best(d),1e6);
const bsize=()=>Math.max(30,Math.min(44,H*.06)), bx=()=>Math.max(80,Math.min(200,W*.28));

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*dpr|0; cv.height=H*dpr|0; ctx.setTransform(dpr,0,0,dpr,0,0);
  GH=Math.max(70,H*.13); PW=Math.max(56,Math.min(80,H*.095));
  S=Math.max(.7,Math.min(1.5,H/800)); // scales physics & speed so the feel matches on every screen size
  if(!clouds.length){
    clouds=Array.from({length:6},()=>({x:Math.random()*W,y:.06+Math.random()*.36,s:.7+Math.random()*.9,v:6+Math.random()*10}));
    stars=Array.from({length:80},()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.6+.5,p:Math.random()*6}));
  }
  if(bird){ bird.size=bsize(); bird.x=bx(); }
}
function resetRun(){
  bird={x:bx(),y:H*.42,vy:0,rot:0,ph:0,sq:0,size:bsize()};
  pipes=[]; parts=[]; pops=[]; pat=null; score=0; shake=0; flash=0; speed=DIFF[diff].s0*S; $('score').textContent='0';
  addPipe(W+160);
}
function addPipe(x){
  const D=DIFF[diff], prog=Math.min(score/40,1);
  const gap=Math.max(H*(D.gap0-(D.gap0-D.gap1)*prog),bird.size*3.3), amp=(score>=10?Math.min((score-8)*1.6,40):0)*Math.max(.6,H/800); // pipes start swaying after 10 points
  const mn=50+amp, mx=Math.max(mn+10,H-GH-gap-50-amp), span=mx-mn, p=pipes[pipes.length-1];
  let base=mn+Math.random()*span;
  if(score>=4){ // twists & turns: the course follows short patterns (stairs, zig-zag, wave) before going random again
    if(!pat||pat.left<=0) pat={t:['stair','zig','wave','rand'][Math.random()*4|0],left:4+(Math.random()*3|0),i:0,dir:Math.random()<.5?-1:1};
    const prev=p?p.base:mn+span/2;
    if(pat.t==='stair'){ base=prev+pat.dir*span*.2; if(base<mn+span*.08||base>mx-span*.08) pat.dir*=-1; }
    else if(pat.t==='zig') base=pat.i%2?mn+span*.15:mx-span*.15;
    else if(pat.t==='wave') base=mn+span/2+Math.sin(pat.i*1.15)*span*.38;
    pat.left--; pat.i++;
  }
  if(p){ const sh=H*.27; base=Math.max(p.base-sh,Math.min(p.base+sh,base)); } // keep consecutive gaps reachable
  base=Math.max(mn,Math.min(Math.max(mn,mx),base));
  pipes.push({x,base,top:base,gap,amp,ph:Math.random()*6,scored:false});
}

/* ================= STATE MACHINE ================= */
function show(n){ for(const k in screens) screens[k].classList.toggle('on',k===n); }
function setState(s){
  state=s;
  show(s==='home'||s==='chars'||s==='pause'?s:'');
  hud.classList.toggle('on',s==='ready'||s==='play'||s==='count'||s==='pause');
  $('ready').style.display=s==='ready'?'block':'none';
  $('count').style.display=s==='count'?'block':'none';
  $('pauseBtn').style.visibility=(s==='ready'||s==='play')?'visible':'hidden';
  if(s==='home') refreshHome();
}
const startRun=()=>{ resetRun(); setState('ready'); };
function pause(){ if(state==='play'){ $('pauseInfo').textContent=`Score ${score}`; setState('pause'); } }
function resume(){ if(state==='pause'){ cd=3; setState('count'); Sound.tick(); } }
function flap(){
  if(state==='ready') setState('play');
  if(state!=='play') return;
  bird.vy=DIFF[diff].f*S; bird.sq=1; Sound.flap();
  for(let i=0;i<5;i++) parts.push({x:bird.x-12,y:bird.y+6,vx:-50-Math.random()*70,vy:Math.random()*80-20,l:.45,m:.45,c:'#9ff',r:3});
}
function die(){
  if(state!=='play') return;
  Sound.hit(); vib([40,30,70]); if(!reduce) shake=.28; flash=.15;
  for(let i=0;i<24;i++) parts.push({x:bird.x,y:bird.y,vx:(Math.random()-.5)*340,vy:(Math.random()-.5)*340,l:.8,m:.8,c:BIRDS[sel].body,r:4});
  const prev=bestOf(diff), isNew=score>prev; if(isNew) Store.set(K.best(diff),score);
  $('fin').textContent=score; $('best').textContent=Math.max(prev,score); $('overDiff').textContent=isNew&&score>0?'NEW BEST!':'';
  const m=MEDALS.find(x=>score>=x[0]), el=$('medal'); el.textContent=m?m[1]+' MEDAL':'KEEP FLYING'; el.style.setProperty('--m',m?m[2]:'#94a3b8');
  state='dead'; $('pauseBtn').style.visibility='hidden';
  setTimeout(()=>{ if(state==='dead'){ hud.classList.remove('on'); show('over'); countUp($('fin'),score); } },700);
}

/* ================= UPDATE ================= */
function update(dt){
  const D=DIFF[diff], menu=state==='home'||state==='chars';
  const T=PAL[(menu?Math.floor(bgT/12):Math.floor(score/10))%4];
  for(const k in T){ const b=rgb(T[k]); for(let i=0;i<3;i++) pal[k][i]+=(b[i]-pal[k][i])*Math.min(1,dt*1.2); }
  if(state==='count'){ cd-=dt; const n=Math.max(1,Math.ceil(cd)); if($('count').textContent!==String(n)){ $('count').textContent=n; Sound.tick(); } if(cd<=0) setState('play'); return; }
  if(state==='pause') return; // physics, pipes, score and particles stay frozen
  bgT+=dt; clouds.forEach(c=>{ c.x-=c.v*dt; if(c.x<-160) c.x=W+160; });
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.l-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.l<=0) parts.splice(i,1); }
  for(const q of pops){ q.l-=dt*1.1; q.y-=60*dt; } pops=pops.filter(q=>q.l>0);
  if(shake>0) shake-=dt; if(flash>0) flash-=dt;
  if(menu){ groundOff=(groundOff+70*dt)%40; return; }
  if(state==='ready'){ idleT+=dt; bird.y=H*.42+Math.sin(idleT*4)*8; bird.ph+=dt*14; groundOff=(groundOff+speed*dt)%40; return; }
  if(state==='dead'){ bird.vy=Math.min(bird.vy+D.g*S*dt,900*S); bird.y=Math.min(bird.y+bird.vy*dt,H-GH-bird.size*.4); bird.rot=Math.min(bird.rot+dt*6,1.5); return; }
  // --- playing ---
  const prog=Math.min(score/40,1); speed=(D.s0+(D.s1-D.s0)*prog)*S;
  bird.vy=Math.min(bird.vy+D.g*S*dt,720*S); bird.y+=bird.vy*dt; bird.ph+=dt*(bird.vy<0?26:13); bird.sq=Math.max(0,bird.sq-dt*6);
  bird.rot+=(Math.max(-.5,Math.min(1.4,bird.vy/(450*S)))-bird.rot)*Math.min(1,dt*12);
  groundOff=(groundOff+speed*dt)%40;
  const lp=pipes[pipes.length-1]; if(!lp||lp.x+D.dist*S<W+30) addPipe(lp?lp.x+D.dist*S:W+160);
  const r=bird.size*.34;
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i]; p.x-=speed*dt; p.top=p.base+(p.amp?Math.sin(bgT*2+p.ph)*p.amp:0);
    if(p.x+PW<-10){ pipes.splice(i,1); continue; }
    if(!p.scored&&p.x+PW<bird.x){ p.scored=true; score++; Sound.point(); vib(12); const s=$('score'); s.textContent=score; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
      for(let j=0;j<8;j++) parts.push({x:bird.x,y:bird.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.5,m:.5,c:'#fde047',r:3}); }
    if(bird.x+r>p.x&&bird.x-r<p.x+PW&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)) die();
  }
  if(bird.y+r>H-GH){ bird.y=H-GH-r; die(); }
  if(bird.y-r<-40){ bird.y=-40+r; bird.vy=0; }
}

/* ================= RENDER ================= */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ridge(base,amp,fr,off,col){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W+10;x+=10){ const t=(x+off)*fr; ctx.lineTo(x,base-(Math.sin(t)*.6+Math.sin(t*2.3+1)*.4+1)*amp); }
  ctx.lineTo(W+10,H); ctx.fill();
}
function pipeShape(x,y,w,h,capTop){
  const c=PIPE[diff], stops=g=>{ g.addColorStop(0,c[0]); g.addColorStop(.3,c[1]); g.addColorStop(.45,c[2]); g.addColorStop(.62,c[1]); g.addColorStop(1,c[0]); return g; };
  ctx.fillStyle=stops(ctx.createLinearGradient(x+3,0,x+w-3,0)); ctx.fillRect(x+3,y,w-6,h);
  const ch=28, cy=capTop?y+h-ch:y;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x+3,capTop?cy-10:cy+ch,w-6,10);
  ctx.fillStyle=stops(ctx.createLinearGradient(x-5,0,x+w+5,0)); rr(x-5,cy,w+10,ch,8); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=2; ctx.stroke();
}
function render(){
  const sx=shake>0?(Math.random()-.5)*9:0, sy=shake>0?(Math.random()-.5)*9:0, gy=H-GH;
  ctx.save(); ctx.translate(sx,sy);
  const sky=ctx.createLinearGradient(0,0,0,gy); sky.addColorStop(0,css(pal.t)); sky.addColorStop(1,css(pal.b));
  ctx.fillStyle=sky; ctx.fillRect(-10,-10,W+20,H+20);
  const dark=Math.max(0,1-(pal.t[1]+pal.t[2])/260);
  if(dark>.02) for(const st of stars){ ctx.globalAlpha=dark*(.45+.55*Math.sin(bgT*2+st.p)); ctx.fillStyle='#fff'; ctx.fillRect(st.x*W,st.y*H,st.r,st.r); }
  ctx.globalAlpha=1;
  // sun / moon with glow
  const ox=W*.74, oy=gy*.3, or=Math.min(W,H)*.07;
  let og=ctx.createRadialGradient(ox,oy,or*.3,ox,oy,or*4.5); og.addColorStop(0,'rgba(255,255,255,.4)'); og.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=og; ctx.fillRect(ox-or*5,oy-or*5,or*10,or*10);
  og=ctx.createRadialGradient(ox-or*.3,oy-or*.3,or*.1,ox,oy,or); og.addColorStop(0,'#fffef2'); og.addColorStop(1,'#ffe6a8');
  ctx.fillStyle=og; ctx.beginPath(); ctx.arc(ox,oy,or,0,7); ctx.fill();
  // layered parallax ridges + puffy clouds
  ridge(gy-8,H*.26,.005,bgT*8,css(pal.f));
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.beginPath();
  for(const c of clouds){ const cy=c.y*H, k=c.s;
    for(const [a,b,rx,ry] of [[0,0,30,15],[26,-9,26,18],[54,0,32,15],[26,4,44,11]]){ ctx.moveTo(c.x+a*k+rx*k,cy+b*k); ctx.ellipse(c.x+a*k,cy+b*k,rx*k,ry*k,0,0,7); } }
  ctx.fill();
  ridge(gy-4,H*.17,.009,bgT*16,css(pal.f.map((v,i)=>(v+pal.n[i])/2)));
  ridge(gy,H*.09,.013,bgT*28,css(pal.n));
  for(const p of pipes){ pipeShape(p.x,-10,PW,p.top+10,true); pipeShape(p.x,p.top+p.gap,PW,H,false); }
  // ground (neon grid)
  const g=ctx.createLinearGradient(0,gy,0,H); g.addColorStop(0,'#1a1646'); g.addColorStop(1,'#080620'); ctx.fillStyle=g; ctx.fillRect(-10,gy,W+20,GH+10);
  ctx.fillStyle='rgba(34,211,238,.25)'; ctx.fillRect(-10,gy+3,W+20,9); ctx.fillStyle='#22d3ee'; ctx.fillRect(-10,gy,W+20,3);
  ctx.strokeStyle='rgba(139,92,246,.5)'; ctx.lineWidth=2; ctx.beginPath();
  for(let x=-groundOff-40;x<W+80;x+=40){ ctx.moveTo(x,gy+3); ctx.lineTo(x-34,H); }
  ctx.moveTo(0,gy+GH*.35); ctx.lineTo(W,gy+GH*.35); ctx.moveTo(0,gy+GH*.7); ctx.lineTo(W,gy+GH*.7); ctx.stroke();
  if(bird&&state!=='home'&&state!=='chars'){ // soft glow under bird, then the bird
    const bg=ctx.createRadialGradient(bird.x,bird.y,2,bird.x,bird.y,bird.size*1.6); bg.addColorStop(0,'rgba(255,255,255,.22)'); bg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=bg; ctx.fillRect(bird.x-bird.size*2,bird.y-bird.size*2,bird.size*4,bird.size*4);
    ctx.save(); ctx.translate(bird.x,bird.y); ctx.scale(1-bird.sq*.1,1+bird.sq*.14); drawBird(ctx,0,0,bird.size*1.4,BIRDS[sel],bird.ph,bird.rot); ctx.restore();
  }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.l/p.m); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.textAlign='center'; ctx.lineJoin='round'; ctx.font=`900 ${Math.round((bird?bird.size:36)*.62)}px "Segoe UI",system-ui,sans-serif`;
  for(const q of pops){ ctx.globalAlpha=Math.max(0,q.l); ctx.lineWidth=5; ctx.strokeStyle='rgba(30,10,80,.85)'; ctx.strokeText(q.t,q.x,q.y); ctx.fillStyle=q.c; ctx.fillText(q.t,q.x,q.y); }
  ctx.globalAlpha=1; ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,10,.38)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${Math.min(.5,flash*3)})`; ctx.fillRect(0,0,W,H); }
}
function frame(t){ const dt=Math.min((t-last)/1000||0,.05); last=t; update(dt); render(); requestAnimationFrame(frame); }

/* ================= UI ================= */
const pctx=$('preview').getContext('2d');
function previewLoop(t){
  if(state==='home'){ const s=t/1000; pctx.clearRect(0,0,180,140); drawBird(pctx,90,70+Math.sin(s*3)*7,104,BIRDS[sel],s*14,Math.sin(s*3)*.15); }
  requestAnimationFrame(previewLoop);
}
function refreshHome(){
  $('homeName').textContent=`${BIRDS[sel].name} · ${BIRDS[sel].color}`;
  $('homeBest').textContent=`BEST: ${bestOf(diff)}`;
}
function buildUI(){
  const g=$('grid'); g.innerHTML='';
  BIRDS.forEach((b,i)=>{
    const d=document.createElement('div'); d.className='card'+(i===sel?' sel':''); d.tabIndex=0; d.dataset.i=i;
    d.setAttribute('role','button'); d.setAttribute('aria-label','Select '+b.name);
    const c=document.createElement('canvas'); c.width=168; c.height=132; drawBird(c.getContext('2d'),84,66,96,b,0,0);
    d.appendChild(c); d.insertAdjacentHTML('beforeend',`${b.name}<small>${b.color}</small>`); g.appendChild(d);
  });
}
function countUp(el,to){ const t0=performance.now(); (function f(t){ const k=Math.min(1,(t-t0)/600); el.textContent=Math.round(to*k); if(k<1) requestAnimationFrame(f); })(t0); }
function selectBird(i){ sel=i; Store.set(K.sel,i); [...$('grid').children].forEach((el,k)=>el.classList.toggle('sel',k===i)); refreshHome(); }
const updMute=()=>{ $('muteBtn').textContent=Sound.muted?'🔇':'🔊'; };
let resetArm=0;
function act(a){
  switch(a){
    case 'play': case 'restart': startRun(); break;
    case 'chars': setState('chars'); break;
    case 'back': case 'home': resetRun(); setState('home'); break;
    case 'pause': pause(); break;
    case 'resume': resume(); break;
    case 'reset': { const b=$('resetBtn');
      if(resetArm){ clearTimeout(resetArm); resetArm=0; Store.set(K.best(diff),0); selectBird(0); b.textContent='PROGRESS RESET ✓'; setTimeout(()=>{ b.textContent='RESET PROGRESS'; },1500); }
      else { b.textContent='TAP AGAIN TO CONFIRM'; resetArm=setTimeout(()=>{ resetArm=0; b.textContent='RESET PROGRESS'; },3000); }
      break; }
    case 'mute': Sound.toggle(); updMute(); break;
  }
}

/* ================= INPUT (listeners registered once) ================= */
document.addEventListener('click',e=>{
  Sound.unlock();
  const c=e.target.closest('.card'); if(c){ selectBird(+c.dataset.i); return; }
  const b=e.target.closest('[data-act]'); if(b){ act(b.dataset.act); b.blur(); }
});
document.addEventListener('keydown',e=>{
  const card=e.target.closest&&e.target.closest('.card');
  if(card&&(e.code==='Enter'||e.code==='Space')){ e.preventDefault(); selectBird(+card.dataset.i); return; }
  if(e.code==='Escape'||e.code==='KeyP'){ state==='pause'?resume():pause(); return; }
  if((e.code==='Space'||e.code==='ArrowUp')&&e.target.tagName!=='BUTTON'){
    e.preventDefault(); if(!e.repeat&&(state==='play'||state==='ready')){ Sound.unlock(); flap(); }
  }
});
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='play'||state==='ready'){ Sound.unlock(); flap(); } });
document.addEventListener('touchmove',e=>{ if(!e.target.closest('#chars')) e.preventDefault(); },{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);
if(window.visualViewport) visualViewport.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
window.addEventListener('blur',pause);

/* ================= INIT ================= */
resize(); resetRun(); buildUI(); updMute(); setState('home');
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); requestAnimationFrame(previewLoop); });
})();
</script>
</body>
</html>
