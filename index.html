<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AVIROX – Tap, glide, survive</title>
<meta name="description" content="AVIROX is a fast one-tap arcade game. Pick your bird, glide through the gaps and beat your best score.">
<style>
:root{--g1:#fff1c2;--g2:#f5c451;--g3:#c8922f;--g4:#6e4a12;--ink:#050403;--c1:var(--g2);--c2:var(--g3);--c3:var(--g1);
--glass:linear-gradient(150deg,rgba(255,226,150,.15),rgba(24,17,6,.55) 42%,rgba(6,4,1,.72));--line:rgba(255,214,120,.3);
--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,.9,.28,1);
--lg:inset 0 1px 0 rgba(255,246,214,.6),inset 0 -1px 0 rgba(0,0,0,.55),inset 0 0 24px rgba(255,200,90,.08),0 12px 32px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);touch-action:none;overscroll-behavior:none;color:var(--g1);
 font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
#game{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;overflow-y:auto;
 padding:calc(env(safe-area-inset-top,0px) + 70px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);
 opacity:0;pointer-events:none;visibility:hidden;transform:translateY(18px) scale(.96);
 transition:opacity .5s var(--ease),transform .6s var(--ease),visibility 0s linear .5s}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.screen.on{opacity:1;pointer-events:auto;visibility:visible;transform:none;transition:opacity .5s var(--ease),transform .6s var(--ease),visibility 0s}
.screen.on>*{animation:rise .75s var(--ease) backwards}
.screen.on>:nth-child(2){animation-delay:.07s}.screen.on>:nth-child(3){animation-delay:.14s}.screen.on>:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
.dim{background:radial-gradient(circle at 50% 38%,rgba(90,60,10,.35),rgba(3,2,1,.8));backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5)}
h1{margin:0;font-size:clamp(52px,14vmin,128px);font-weight:900;letter-spacing:.14em;padding-left:.14em;line-height:1;
 background:linear-gradient(100deg,#8a5a12 0%,#ffe9a8 22%,#f5c451 40%,#fff8dc 55%,#c8922f 75%,#8a5a12 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:goldflow 7s linear infinite;
 filter:drop-shadow(0 4px 0 rgba(40,24,2,.8)) drop-shadow(0 0 28px rgba(245,196,81,.4))}
@keyframes goldflow{to{background-position:-250% 0}}
h2{margin:0;font-size:clamp(28px,6.5vmin,48px);font-weight:900;letter-spacing:.08em;color:#ffe9a8;text-shadow:0 3px 0 rgba(40,24,2,.8),0 0 28px rgba(245,196,81,.6)}
.sub{color:#e8c878;opacity:.9;letter-spacing:.22em;font-size:clamp(12px,2.3vmin,16px);font-weight:600;text-align:center}

/* ---- Liquid glass material ---- */
button.ghost,.panel,.card,.chip,.gh{background:var(--glass);border:1px solid var(--line);box-shadow:var(--lg);
 -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7)}
button::before,.card::before,.panel::before,.chip::before,.gh::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(112deg,transparent 38%,rgba(255,244,210,.4) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:160% 0;
 transition:background-position 1s var(--ease)}
button:hover::before,.card:hover::before,.gh:hover::before{background-position:-60% 0}
button::after,.gh::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
 background:radial-gradient(90px circle at var(--mx,50%) var(--my,0%),rgba(255,240,190,.5),transparent 70%)}
button:hover::after,.gh:hover::after{opacity:1}
button[data-act=play]::before,button[data-act=restart]::before,button[data-act=resume]::before{animation:sweep 4.5s var(--ease) infinite}
@keyframes sweep{0%,55%{background-position:160% 0}100%{background-position:-60% 0}}

button{position:relative;font:inherit;font-weight:800;font-size:clamp(16px,3vmin,22px);letter-spacing:.14em;color:#1a1103;border:0;cursor:pointer;min-height:56px;min-width:210px;
 padding:12px 30px;border-radius:999px;margin-bottom:10px;
 background:linear-gradient(165deg,rgba(255,243,196,.96),rgba(247,205,95,.9) 38%,rgba(200,146,47,.92));
 box-shadow:inset 0 2px 1px rgba(255,255,255,.85),inset 0 -6px 14px rgba(110,70,10,.45),inset 0 0 0 1px rgba(255,235,170,.5),0 12px 30px rgba(245,196,81,.32),0 4px 10px rgba(0,0,0,.5);
 text-shadow:0 1px 0 rgba(255,255,255,.4);transition:transform .45s var(--spring),box-shadow .3s,filter .3s}
button:hover{filter:brightness(1.08);transform:translateY(-3px) scale(1.03)}
button:active{transform:scale(.95);transition-duration:.12s}
button:focus-visible,.card:focus-visible,.gh:focus-visible{outline:3px solid var(--g1);outline-offset:3px}
button.ghost{color:#ffe29a;text-shadow:0 0 14px rgba(245,196,81,.5);box-shadow:var(--lg)}
button.sm{min-width:0;min-height:42px;font-size:clamp(12px,2.2vmin,14px);padding:8px 22px;opacity:.92}
.panel{position:relative;border-radius:26px;padding:14px 32px;text-align:center}
.panel small{opacity:.75;display:block;font-size:13px;letter-spacing:.15em;color:#e8c878}
.panel b{display:block;font-size:clamp(34px,8vmin,56px);color:#fff1c2;text-shadow:0 0 24px rgba(245,196,81,.55)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.medal{padding:8px 24px;border-radius:999px;font-weight:800;letter-spacing:.1em;border:1px solid var(--m,#cbb27a);color:var(--m,#cbb27a);
 background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,246,214,.35),0 0 26px var(--m,transparent)}
#preview{width:180px;height:140px;filter:drop-shadow(0 0 26px rgba(245,196,81,.5))}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;width:min(760px,100%);padding:12px}
#chars{touch-action:pan-y}
.card{position:relative;padding:10px 6px;border-radius:24px;text-align:center;cursor:pointer;font-weight:800;color:#ffe9a8;
 transition:transform .45s var(--spring),box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-5px) scale(1.02)}.card:active{transform:scale(.96)}
.card canvas{width:84px;height:66px;display:block;margin:0 auto 4px}
.card small{display:block;opacity:.65;font-weight:600;font-size:12px;color:#e8c878}
.card.sel{border-color:var(--g2);box-shadow:var(--lg),0 0 0 2px var(--g2),0 0 34px rgba(245,196,81,.5)}
.card.sel::after{content:"SELECTED";position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:2px 12px;border-radius:999px;font-size:11px;letter-spacing:.1em;color:#1a1103;
 background:linear-gradient(165deg,#fff1c2,#f5c451 55%,#c8922f);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(245,196,81,.4)}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}#hud.on{opacity:1}
#score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;font-size:clamp(54px,12vmin,96px);font-weight:900;line-height:1;color:#fff1c2;
 text-shadow:0 4px 0 rgba(40,24,2,.75),0 0 34px rgba(245,196,81,.7)}
#score.pop{animation:pop .35s var(--spring)}@keyframes pop{50%{transform:scale(1.3)}}
#count{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:clamp(80px,22vmin,180px);font-weight:900;color:#ffe9a8;text-shadow:0 0 50px var(--g2)}
#ready{position:absolute;left:0;right:0;top:64%;text-align:center;font-weight:700;letter-spacing:.2em;font-size:clamp(14px,3vmin,22px);color:#ffe29a;animation:bob 1.1s ease-in-out infinite alternate;text-shadow:0 2px 12px #000}
@keyframes bob{to{transform:translateY(-8px);opacity:.7}}
.ico{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;min-width:50px;width:50px;height:50px;min-height:50px;padding:0;margin:0;font-size:20px;pointer-events:auto}
#muteBtn{left:calc(env(safe-area-inset-left,0px) + 12px)}#pauseBtn{right:calc(env(safe-area-inset-right,0px) + 12px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Home ---- */
#home>.hero{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vmin,22px);width:min(460px,100%)}
#home>.gh{margin:0}
.hero-a,.hero-b{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.6vmin,22px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{position:relative;overflow:hidden;display:grid;place-items:center;width:clamp(170px,30vmin,230px);aspect-ratio:1;
 background:radial-gradient(circle at 35% 28%,rgba(255,236,170,.32),rgba(245,196,81,.1) 45%,rgba(6,4,1,.55) 78%);
 border:1px solid rgba(255,226,150,.45);
 box-shadow:inset 0 2px 2px rgba(255,248,220,.6),inset 0 -14px 30px rgba(110,70,10,.45),inset 0 0 40px rgba(245,196,81,.18),0 22px 60px rgba(0,0,0,.6),0 0 70px rgba(245,196,81,.2);
 -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
 animation:morph 9s ease-in-out infinite alternate,floaty 5s ease-in-out infinite alternate}
.stage::before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(255,236,170,.4) 30%,transparent 42% 70%,rgba(245,196,81,.3) 82%,transparent 92%);animation:spin 9s linear infinite}
.stage::after{content:"";position:absolute;left:14%;top:8%;width:46%;height:24%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));filter:blur(2px);transform:rotate(-24deg)}
.stage canvas{position:relative;z-index:1}
@keyframes morph{0%{border-radius:50%}33%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}66%{border-radius:46% 54% 44% 56%/54% 46% 56% 44%}100%{border-radius:52% 48% 56% 44%/44% 52% 48% 56%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{to{translate:0 -8px}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{position:relative;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.12em;white-space:nowrap;color:#ffe9a8}
.chip:empty{display:none}
#homeBest{border-color:rgba(255,214,120,.65);color:#fff1c2}
.btns{display:flex;flex-direction:column;align-items:center;width:min(270px,100%)}
.btns button{width:100%}
#resetBtn{min-height:40px;width:auto;margin:0;padding:8px 14px;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
 font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.6;text-decoration:underline;text-underline-offset:4px;text-shadow:none}
#resetBtn::before,#resetBtn::after{display:none}
#resetBtn:hover{opacity:1;transform:none;filter:none}
#resetBtn:active{box-shadow:none;transform:none}
.gh{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 22px;border-radius:999px;color:#ffe9a8;text-decoration:none;
 font-size:14px;font-weight:700;letter-spacing:.04em;transition:transform .45s var(--spring),box-shadow .3s,border-color .3s}
.gh svg{width:20px;height:20px;fill:currentColor;flex:none}
.gh:hover{border-color:var(--g2);box-shadow:var(--lg),0 0 28px rgba(245,196,81,.4);transform:translateY(-2px)}
.gh:active{transform:scale(.95)}
@media (max-height:520px){
 #preview{width:116px;height:90px}h1{font-size:clamp(40px,11vmin,80px)}.screen{padding-top:64px;gap:8px}
 #home{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
 #home>.hero{flex-direction:row;justify-content:center;gap:clamp(24px,6vw,56px);width:min(760px,100%)}
 .stage{width:128px}.brand{gap:8px}.hero-a,.hero-b{gap:10px}.btns button{min-height:46px}
 .gh{min-height:36px;font-size:13px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<section class="screen" id="home">
  <div class="hero">
    <div class="hero-a">
      <div class="brand">
        <h1>AVIROX</h1>
        <div class="sub">TAP · GLIDE · SURVIVE</div>
      </div>
      <div class="stage"><canvas id="preview" width="180" height="140" aria-hidden="true"></canvas></div>
    </div>
    <div class="hero-b">
      <div class="chips">
        <span class="chip" id="homeName"></span>
        <span class="chip" id="homeBest"></span>
      </div>
      <div class="btns">
        <button data-act="play">PLAY</button>
        <button class="ghost" data-act="chars">CHARACTERS</button>
        <button class="ghost sm" id="resetBtn" data-act="reset">RESET PROGRESS</button>
      </div>
    </div>
  </div>
  <a class="gh" href="https://github.com/bala-obito" target="_blank" rel="noopener noreferrer" aria-label="Created by Balamurugan – open GitHub profile" title="github.com/bala-obito">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <span>Created by Balamurugan</span>
  </a>
</section>

<section class="screen" id="chars">
  <h2>CHOOSE YOUR BIRD</h2>
  <div id="grid"></div>
  <button data-act="back">BACK</button>
</section>

<div id="hud">
  <div id="score">0</div>
  <div id="count"></div>
  <div id="ready">TAP · CLICK · SPACE</div>
</div>
<button class="ico ghost" id="pauseBtn" data-act="pause" aria-label="Pause">❚❚</button>
<button class="ico ghost" id="muteBtn" data-act="mute" aria-label="Toggle sound">🔊</button>

<section class="screen dim" id="pause">
  <h2>PAUSED</h2>
  <div class="sub" id="pauseInfo"></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <button data-act="resume">RESUME</button>
    <button class="ghost" data-act="restart">RESTART</button>
    <button class="ghost" data-act="home">HOME</button>
  </div>
</section>

<section class="screen dim" id="over">
  <h2>GAME OVER</h2>
  <div class="sub" id="overDiff"></div>
  <div class="row">
    <div class="panel"><small>SCORE</small><b id="fin">0</b></div>
    <div class="panel"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="medal" id="medal"></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <button data-act="restart">PLAY AGAIN</button>
    <button class="ghost" data-act="home">HOME</button>
  </div>
</section>

<script>
(() => {
'use strict';

/* ================= CONFIG ================= */
const DIFF = { // single balanced mode; speed up and gaps shrink automatically as the score grows
  normal: {n:'Normal', g:1580, f:-440, s0:165, s1:290, gap0:.265, gap1:.19, dist:240, amp:0}
};
const BIRDS = [
  {name:'Sunny',color:'Yellow',body:'#f8d030',wing:'#f0a820'},{name:'Blaze',color:'Red',body:'#e63b2e',wing:'#a82218'},
  {name:'Ocean',color:'Blue',body:'#2f8fe8',wing:'#1c5fb0'},{name:'Minty',color:'Green',body:'#42d17a',wing:'#23a055'},
  {name:'Shadow',color:'Black',body:'#3a3a44',wing:'#1c1c24'},{name:'Violet',color:'Purple',body:'#9a52e0',wing:'#6c2fb0'},
  {name:'Rosie',color:'Pink',body:'#ff8fc0',wing:'#e0558f'},{name:'Tangerine',color:'Orange',body:'#ff9a26',wing:'#d06a0a'},
  {name:'Frost',color:'Cyan',body:'#a8f0f8',wing:'#5cc8d8'},{name:'Golden',color:'Gold',body:'#ffc800',wing:'#c8900a'}
];
const PIPE = {easy:['#0b5a2a','#34d058','#d6ffe0'],normal:['#4a3008','#f5c451','#fff3c9'],hard:['#7a2d0a','#fb923c','#ffe9d0'],insane:['#6b0f55','#e879f9','#fde4ff']};
const PAL = [ // sky top, sky bottom, far ridge, near ridge — cycles every 10 points
  {t:'#050403',b:'#6b4a12',f:'#2a1d08',n:'#120c04'},{t:'#0a0705',b:'#b8862b',f:'#3a2a0e',n:'#1a1208'},
  {t:'#120a02',b:'#e0a73a',f:'#4a3210',n:'#1d1408'},{t:'#030202',b:'#3a2808',f:'#1f1608',n:'#0c0803'}];
const MEDALS = [[50,'PLATINUM','#fff6d6'],[30,'GOLD','#f5c451'],[15,'SILVER','#d9d0bd'],[5,'BRONZE','#c98a45']];
const K = {sel:'avirox.bird', diff:'avirox.diff', mute:'avirox.mute', best:d=>'avirox.best.'+d};

/* ================= UTILITIES ================= */
const $ = id => document.getElementById(id);
const rgb = h => { const n=parseInt(h.slice(1),16); return [n>>16,n>>8&255,n&255]; };
const css = a => `rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mix = (h,t,k) => { const a=rgb(h), b=t==='w'?[255,255,255]:[0,0,0]; return css(a.map((v,i)=>v+(b[i]-v)*k)); };
const Store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} },
  int(k,max){ const n=parseInt(this.get(k),10); return Number.isFinite(n)&&n>=0&&n<=max?n:0; }
};

/* ================= AUDIO ================= */
const Sound = {
  ctx:null, muted:Store.get(K.mute)==='1',
  unlock(){ try{ if(!this.ctx){ const A=window.AudioContext||window.webkitAudioContext; if(A) this.ctx=new A(); }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); }catch(e){ this.ctx=null; } },
  tone(f1,f2,d,type='sine',v=.09){
    if(this.muted||!this.ctx) return;
    try{ const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
      o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d);
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+d); }catch(e){}
  },
  flap(){ this.tone(420,700,.11,'triangle') }, point(p){ this.tone(p?1100:880,p?1760:1320,p?.24:.14,'sine',.12) },
  hit(){ this.tone(240,40,.35,'sawtooth',.13) }, tick(){ this.tone(600,600,.08,'square',.05) },
  toggle(){ this.muted=!this.muted; Store.set(K.mute,this.muted?1:0); }
};

const vib=p=>{ try{ if(!Sound.muted&&navigator.vibrate) navigator.vibrate(p); }catch(e){} };

/* ================= BIRD RENDERER (shared by game, home preview, cards) ================= */
function drawBird(c,x,y,w,d,ph,rot){
  const u=w/34, fl=Math.sin(ph), ol=mix(d.body,'k',.68); let g;
  c.save(); c.translate(x,y+1); c.rotate(rot||0); c.scale(u,u); c.lineJoin='round'; c.lineCap='round';
  const body=()=>{ c.beginPath(); c.moveTo(14.5,-2); c.bezierCurveTo(14.5,-10.5,7,-12.5,0,-11.6); c.bezierCurveTo(-8,-10.6,-14,-5.5,-19,-1);
    c.bezierCurveTo(-14,3.5,-8,11,0,11.6); c.bezierCurveTo(8,12,14.5,8,14.5,-2); c.closePath(); };
  // slim tail feathers
  c.save(); c.translate(-16,-.5);
  for(let i=-1;i<=1;i++){ c.save(); c.rotate(i*.34+.08); g=c.createLinearGradient(-11,0,0,0); g.addColorStop(0,mix(d.wing,'k',.4)); g.addColorStop(1,d.wing);

/* ================= GAME STATE ================= */
const cv=$('game'), ctx=cv.getContext('2d'), hud=$('hud');
const screens={home:$('home'),chars:$('chars'),pause:$('pause'),over:$('over')};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S=1,W=0,H=0,dpr=1,GH=0,PW=64,state='home',sel=Store.int(K.sel,BIRDS.length-1);
const diff='normal', ORB=[{x:.2,y:.3,r:.5,v:.25,p:0},{x:.8,y:.55,r:.45,v:.2,p:2},{x:.5,y:.8,r:.55,v:.3,p:4}];

const bestOf=d=>Store.int(K.best(d),1e6);
const bsize=()=>Math.max(30,Math.min(44,H*.06)), bx=()=>Math.max(80,Math.min(200,W*.28));

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*dpr|0; cv.height=H*dpr|0; ctx.setTransform(dpr,0,0,dpr,0,0);

  S=Math.max(.7,Math.min(1.5,H/800)); // scales physics & speed so the feel matches on every screen size
  if(!clouds.length){
    clouds=Array.from({length:6},()=>({x:Math.random()*W,y:.06+Math.random()*.36,s:.7+Math.random()*.9,v:6+Math.random()*10}));
    stars=Array.from({length:80},()=>({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.6+.5,p:Math.random()*6}));

  if(bird){ bird.size=bsize(); bird.x=bx(); }
}
function resetRun(){
  bird={x:bx(),y:H*.42,vy:0,rot:0,ph:0,sq:0,size:bsize()};
  pipes=[]; parts=[]; pops=[]; pat=null; score=0; shake=0; flash=0; speed=DIFF[diff].s0*S; $('score').textContent='0';
  addPipe(W+160);
}
function addPipe(x){
  const D=DIFF[diff], prog=Math.min(score/40,1);
  const gap=Math.max(H*(D.gap0-(D.gap0-D.gap1)*prog),bird.size*3.3), amp=(score>=10?Math.min((score-8)*1.6,40):0)*Math.max(.6,H/800); // pipes start swaying after 10 points
  const mn=50+amp, mx=Math.max(mn+10,H-GH-gap-50-amp), span=mx-mn, p=pipes[pipes.length-1];
  let base=mn+Math.random()*span;
  if(score>=4){ // twists & turns: the course follows short patterns (stairs, zig-zag, wave) before going random again
    if(!pat||pat.left<=0) pat={t:['stair','zig','wave','rand'][Math.random()*4|0],left:4+(Math.random()*3|0),i:0,dir:Math.random()<.5?-1:1};
    const prev=p?p.base:mn+span/2;
    if(pat.t==='stair'){ base=prev+pat.dir*span*.2; if(base<mn+span*.08||base>mx-span*.08) pat.dir*=-1; }
    else if(pat.t==='zig') base=pat.i%2?mn+span*.15:mx-span*.15;

/* ================= STATE MACHINE ================= */
function show(n){ for(const k in screens) screens[k].classList.toggle('on',k===n); }
function setState(s){
  state=s;
  show(s==='home'||s==='chars'||s==='pause'?s:'');
  hud.classList.toggle('on',s==='ready'||s==='play'||s==='count'||s==='pause');
  $('ready').style.display=s==='ready'?'block':'none';
  $('count').style.display=s==='count'?'block':'none';
  $('pauseBtn').style.visibility=(s==='ready'||s==='play')?'visible':'hidden';
  if(s==='home') refreshHome();
}
const startRun=()=>{ resetRun(); setState('ready'); };
function pause(){ if(state==='play'){ $('pauseInfo').textContent=`Score ${score}`; setState('pause'); } }
function resume(){ if(state==='pause'){ cd=3; setState('count'); Sound.tick(); } }
function flap(){
  if(state==='ready') setState('play');
  if(state!=='play') return;
  bird.vy=DIFF[diff].f*S; bird.sq=1; Sound.flap();
  for(let i=0;i<5;i++) parts.push({x:bird.x-12,y:bird.y+6,vx:-50-Math.random()*70,vy:Math.random()*80-20,l:.45,m:.45,c:'#ffe29a',r:3});
}
function die(){
  if(state!=='play') return;
  Sound.hit(); vib([40,30,70]); if(!reduce) shake=.28; flash=.15;
  for(let i=0;i<24;i++) parts.push({x:bird.x,y:bird.y,vx:(Math.random()-.5)*340,vy:(Math.random()-.5)*340,l:.8,m:.8,c:BIRDS[sel].body,r:4});
  const prev=bestOf(diff), isNew=score>prev; if(isNew) Store.set(K.best(diff),score);
  $('fin').textContent=score; $('best').textContent=Math.max(prev,score); $('overDiff').textContent=isNew&&score>0?'NEW BEST!':'';
  const m=MEDALS.find(x=>score>=x[0]), el=$('medal'); el.textContent=m?m[1]+' MEDAL':'KEEP FLYING'; el.style.setProperty('--m',m?m[2]:'#94a3b8');
  state='dead'; $('pauseBtn').style.visibility='hidden';
  setTimeout(()=>{ if(state==='dead'){ hud.classList.remove('on'); show('over'); countUp($('fin'),score); } },700);
}

/* ================= UPDATE ================= */
function update(dt){
  const D=DIFF[diff], menu=state==='home'||state==='chars';
  const T=PAL[(menu?Math.floor(bgT/12):Math.floor(score/10))%4];
  for(const k in T){ const b=rgb(T[k]); for(let i=0;i<3;i++) pal[k][i]+=(b[i]-pal[k][i])*Math.min(1,dt*1.2); }
  if(state==='count'){ cd-=dt; const n=Math.max(1,Math.ceil(cd)); if($('count').textContent!==String(n)){ $('count').textContent=n; Sound.tick(); } if(cd<=0) setState('play'); return; }
  if(state==='pause') return; // physics, pipes, score and particles stay frozen
  bgT+=dt; clouds.forEach(c=>{ c.x-=c.v*dt; if(c.x<-160) c.x=W+160; });
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.l-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.l<=0) parts.splice(i,1); }
  for(const q of pops){ q.l-=dt*1.1; q.y-=60*dt; } pops=pops.filter(q=>q.l>0);
  if(shake>0) shake-=dt; if(flash>0) flash-=dt;
  if(menu){ groundOff=(groundOff+70*dt)%40; return; }
  if(state==='ready'){ idleT+=dt; bird.y=H*.42+Math.sin(idleT*4)*8; bird.ph+=dt*14; groundOff=(groundOff+speed*dt)%40; return; }
  if(state==='dead'){ bird.vy=Math.min(bird.vy+D.g*S*dt,900*S); bird.y=Math.min(bird.y+bird.vy*dt,H-GH-bird.size*.4); bird.rot=Math.min(bird.rot+dt*6,1.5); return; }
  // --- playing ---
  const prog=Math.min(score/40,1); speed=(D.s0+(D.s1-D.s0)*prog)*S;
  bird.vy=Math.min(bird.vy+D.g*S*dt,720*S); bird.y+=bird.vy*dt; bird.ph+=dt*(bird.vy<0?26:13); bird.sq=Math.max(0,bird.sq-dt*6);
  bird.rot+=(Math.max(-.5,Math.min(1.4,bird.vy/(450*S)))-bird.rot)*Math.min(1,dt*12);
  groundOff=(groundOff+speed*dt)%40;
  const lp=pipes[pipes.length-1]; if(!lp||lp.x+D.dist*S<W+30) addPipe(lp?lp.x+D.dist*S:W+160);
  const r=bird.size*.34;
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i]; p.x-=speed*dt; p.top=p.base+(p.amp?Math.sin(bgT*2+p.ph)*p.amp:0);
    if(p.x+PW<-10){ pipes.splice(i,1); continue; }
    if(!p.scored&&p.x+PW<bird.x){ p.scored=true; score++; Sound.point(); vib(12); const s=$('score'); s.textContent=score; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
      for(let j=0;j<8;j++) parts.push({x:bird.x,y:bird.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.5,m:.5,c:'#ffd45c',r:3}); }
    if(bird.x+r>p.x&&bird.x-r<p.x+PW&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)) die();
  }
  if(bird.y+r>H-GH){ bird.y=H-GH-r; die(); }
  if(bird.y-r<-40){ bird.y=-40+r; bird.vy=0; }
}

/* ================= RENDER ================= */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function ridge(base,amp,fr,off,col){

}
function pipeShape(x,y,w,h,capTop){
  const c=PIPE[diff], stops=g=>{ g.addColorStop(0,c[0]); g.addColorStop(.3,c[1]); g.addColorStop(.45,c[2]); g.addColorStop(.62,c[1]); g.addColorStop(1,c[0]); return g; };

  ctx.fillStyle=stops(ctx.createLinearGradient(x-5,0,x+w+5,0)); rr(x-5,cy,w+10,ch,8); ctx.fill();
  ctx.strokeStyle='rgba(255,236,170,.6)'; ctx.lineWidth=2; ctx.stroke();
}
function render(){
  const sx=shake>0?(Math.random()-.5)*9:0, sy=shake>0?(Math.random()-.5)*9:0, gy=H-GH;
  ctx.save(); ctx.translate(sx,sy);
  const sky=ctx.createLinearGradient(0,0,0,gy); sky.addColorStop(0,css(pal.t)); sky.addColorStop(1,css(pal.b));

  // sun / moon with glow
  const ox=W*.74, oy=gy*.3, or=Math.min(W,H)*.07;
  let og=ctx.createRadialGradient(ox,oy,or*.3,ox,oy,or*4.5); og.addColorStop(0,'rgba(255,214,120,.45)'); og.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=og; ctx.fillRect(ox-or*5,oy-or*5,or*10,or*10);
  og=ctx.createRadialGradient(ox-or*.3,oy-or*.3,or*.1,ox,oy,or); og.addColorStop(0,'#fff6d0'); og.addColorStop(1,'#f5c451');

  ctx.strokeStyle='rgba(245,196,81,.35)'; ctx.lineWidth=2; ctx.beginPath();

    ctx.save(); ctx.translate(bird.x,bird.y); ctx.scale(1-bird.sq*.1,1+bird.sq*.14); drawBird(ctx,0,0,bird.size*1.4,BIRDS[sel],bird.ph,bird.rot); ctx.restore();

function frame(t){ const dt=Math.min((t-last)/1000||0,.05); last=t; update(dt); render(); requestAnimationFrame(frame); }

/* ================= UI ================= */
const pctx=$('preview').getContext('2d');
function previewLoop(t){
  if(state==='home'){ const s=t/1000; pctx.clearRect(0,0,180,140); drawBird(pctx,90,70+Math.sin(s*3)*7,104,BIRDS[sel],s*14,Math.sin(s*3)*.15); }
  requestAnimationFrame(previewLoop);
}
function refreshHome(){
  $('homeName').textContent=`${BIRDS[sel].name} · ${BIRDS[sel].color}`;
  $('homeBest').textContent=`BEST: ${bestOf(diff)}`;
}
function buildUI(){
  const g=$('grid'); g.innerHTML='';
  BIRDS.forEach((b,i)=>{
    const d=document.createElement('div'); d.className='card'+(i===sel?' sel':''); d.tabIndex=0; d.dataset.i=i;
    d.setAttribute('role','button'); d.setAttribute('aria-label','Select '+b.name);
    const c=document.createElement('canvas'); c.width=168; c.height=132; drawBird(c.getContext('2d'),84,66,96,b,0,0);
    d.appendChild(c); d.insertAdjacentHTML('beforeend',`${b.name}<small>${b.color}</small>`); g.appendChild(d);
  });
}
function countUp(el,to){ const t0=performance.now(); (function f(t){ const k=Math.min(1,(t-t0)/600); el.textContent=Math.round(to*k); if(k<1) requestAnimationFrame(f); })(t0); }
function selectBird(i){ sel=i; Store.set(K.sel,i); [...$('grid').children].forEach((el,k)=>el.classList.toggle('sel',k===i)); refreshHome(); }
const updMute=()=>{ $('muteBtn').textContent=Sound.muted?'🔇':'🔊'; };
let resetArm=0;
function act(a){
  switch(a){
    case 'play': case 'restart': startRun(); break;

    case 'back': case 'home': resetRun(); setState('home'); break;
    case 'pause': pause(); break;
    case 'resume': resume(); break;
    case 'reset': { const b=$('resetBtn');
      if(resetArm){ clearTimeout(resetArm); resetArm=0; Store.set(K.best(diff),0); selectBird(0); b.textContent='PROGRESS RESET ✓'; setTimeout(()=>{ b.textContent='RESET PROGRESS'; },1500); }
      else { b.textContent='TAP AGAIN TO CONFIRM'; resetArm=setTimeout(()=>{ resetArm=0; b.textContent='RESET PROGRESS'; },3000); }
      break; }
    case 'mute': Sound.toggle(); updMute(); break;
  }
}

/* ================= INPUT (listeners registered once) ================= */
document.addEventListener('click',e=>{
  Sound.unlock();
  const c=e.target.closest('.card'); if(c){ selectBird(+c.dataset.i); return; }
  const b=e.target.closest('[data-act]'); if(b){ act(b.dataset.act); b.blur(); }
});
document.addEventListener('keydown',e=>{
  const card=e.target.closest&&e.target.closest('.card');
  if(card&&(e.code==='Enter'||e.code==='Space')){ e.preventDefault(); selectBird(+card.dataset.i); return; }
  if(e.code==='Escape'||e.code==='KeyP'){ state==='pause'?resume():pause(); return; }
  if((e.code==='Space'||e.code==='ArrowUp')&&e.target.tagName!=='BUTTON'){
    e.preventDefault(); if(!e.repeat&&(state==='play'||state==='ready')){ Sound.unlock(); flap(); }
  }
});
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); if(state==='play'||state==='ready'){ Sound.unlock(); flap(); } });
document.addEventListener('touchmove',e=>{ if(!e.target.closest('#chars')) e.preventDefault(); },{passive:false});
document.addEventListener('pointermove',e=>{ const g=e.target.closest&&e.target.closest('button,.card,.gh'); if(!g) return; const r=g.getBoundingClientRect(); g.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); g.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); },{passive:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);
if(window.visualViewport) visualViewport.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
window.addEventListener('blur',pause);

/* ================= INIT ================= */
resize(); resetRun(); buildUI(); updMute(); setState('home');
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); requestAnimationFrame(previewLoop); });
})();
</script>
</body>
